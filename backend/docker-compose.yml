version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: voltelite_postgres
    restart: always
    environment:
      POSTGRES_USER: voltelite_user
      POSTGRES_PASSWORD: voltelite_password
      POSTGRES_DB: voltelite_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U voltelite_user -d voltelite_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: .
    container_name: voltelite_backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://voltelite_user:voltelite_password@db:5432/voltelite_db
      - JWT_SECRET=super_secret_volt_elite_jwt_key_change_in_production_9988776655
      - JWT_ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=1440
      - DEV_OTP_MODE=true
      - SIMULATION_MODE=true
    command: >
      sh -c "python seed.py && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

volumes:
  postgres_data:
